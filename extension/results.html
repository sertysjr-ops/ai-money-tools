<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Threadsmith — your thread</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 20px;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    background: #0b0b10; color: #e7e7ee;
    display: flex; justify-content: center;
  }
  main { width: 100%; max-width: 620px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h1 .spark { color: #a78bfa; }
  .sub { color: #8b8b9a; font-size: 13px; margin-bottom: 24px; }
  .tweet {
    background: #15151d; border: 1px solid #262633; border-radius: 14px;
    padding: 14px 16px; margin-bottom: 10px;
    font-size: 15px; line-height: 1.5; white-space: pre-wrap;
    position: relative;
  }
  .tweet .n { color: #a78bfa; font-weight: 700; margin-right: 6px; }
  .tweet .len {
    position: absolute; top: 10px; right: 12px;
    font-size: 11px; color: #55556a;
  }
  .tweet .len.over { color: #f87171; font-weight: 700; }
  .bar { display: flex; gap: 10px; margin: 20px 0; }
  button {
    background: #7c3aed; color: #fff; border: 0; border-radius: 10px;
    padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #8b5cf6; }
  button.ghost { background: #1e1e2a; color: #b9b9c9; }
  .status { color: #8b8b9a; font-size: 14px; padding: 30px 0; text-align: center; }
  .err { color: #f87171; background: #2a1518; border: 1px solid #4c1d24;
         border-radius: 10px; padding: 14px; font-size: 14px; white-space: pre-wrap; }
  .src { color: #55556a; font-size: 12px; margin-top: 30px;
         border-top: 1px solid #1e1e2a; padding-top: 12px; }
</style>
</head>
<body>
<main>
  <h1>🧵 Thread<span class="spark">smith</span></h1>
  <p class="sub" id="meta">working…</p>
  <div id="out"><p class="status">⏳ forging your thread — local model, give it a few seconds…</p></div>
  <div class="bar" id="bar" style="display:none">
    <button id="copy">Copy thread</button>
    <button class="ghost" id="close">Close</button>
  </div>
  <p class="src" id="src"></p>
</main>
<script src="results.js"></script>
</body>
</html>
