<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dani-tools playground</title>
<style>
  :root {
    --bg: #0b0d12; --panel: #12151d; --line: #232838;
    --txt: #e8ecf4; --dim: #8a93a8; --acc: #7c5cff; --acc2: #22d3ee;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--txt);
    font: 15px/1.55 -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; padding: 24px; }
  .wrap { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 20px; font-weight: 700; letter-spacing: .2px; }
  header h1 b { color: var(--acc); }
  header .sub { color: var(--dim); font-size: 13px; }
  .card { background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px; }
  label { font-size: 12px; color: var(--dim); text-transform: uppercase;
    letter-spacing: .7px; display: block; margin-bottom: 6px; }
  select, input[type=text], input[type=number], textarea {
    background: var(--bg); border: 1px solid var(--line); color: var(--txt);
    border-radius: 10px; padding: 10px 12px; font-size: 14px; width: 100%; }
  select:focus, input:focus, textarea:focus { outline: 1px solid var(--acc); }
  textarea { resize: vertical; font-family: inherit; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 220px; }
  #tagline { color: var(--acc2); font-size: 13px; margin-top: 6px; min-height: 1.2em; }
  #flags { display: flex; gap: 14px; flex-wrap: wrap; }
  .flag { display: flex; align-items: center; gap: 8px; background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
  .flag .name { font-size: 13px; color: var(--dim); white-space: nowrap; }
  .flag input[type=text], .flag input[type=number] { width: 110px; padding: 6px 8px; }
  .flag input[type=checkbox] { accent-color: var(--acc); width: 16px; height: 16px; }
  button { background: linear-gradient(90deg, var(--acc), #b44df0); color: #fff;
    border: none; border-radius: 10px; padding: 12px 22px; font-size: 15px;
    font-weight: 600; cursor: pointer; transition: filter .15s; }
  button:hover { filter: brightness(1.12); }
  button:disabled { opacity: .55; cursor: wait; }
  #out { white-space: pre-wrap; word-break: break-word; font-size: 14px;
    min-height: 120px; }
  #outMeta { display: flex; align-items: center; gap: 12px; margin-bottom: 10px;
    font-size: 12px; color: var(--dim); }
  #copy { background: var(--bg); border: 1px solid var(--line); color: var(--txt);
    padding: 5px 12px; font-size: 12px; font-weight: 500; }
  #copy:hover { border-color: var(--acc2); filter: none; }
  .err { color: #f87171; }
  .spin { display: inline-block; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  footer { color: var(--dim); font-size: 12px; text-align: center; }
  footer code { color: var(--acc2); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>dani-tools <b>playground</b></h1>
    <span class="sub" id="health">connecting…</span>
  </header>

  <div class="card">
    <div class="row">
      <div>
        <label for="tool">Tool</label>
        <select id="tool"></select>
        <div id="tagline"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <label>Flags <span id="noFlags" style="display:none">— this tool has none</span></label>
    <div id="flags"></div>
  </div>

  <div class="card">
    <label for="input">Input</label>
    <textarea id="input" rows="8" placeholder="Paste an article, notes, a draft, a product idea…"></textarea>
  </div>

  <button id="run">▶ Run</button>

  <div class="card" id="outCard" style="display:none">
    <div id="outMeta">
      <span id="outInfo"></span>
      <button id="copy">copy</button>
    </div>
    <div id="out"></div>
  </div>

  <footer>
    runs on <code>POST /api/run</code> against your local Ollama — nothing leaves this machine ·
    CLI equivalents: <code>dani-tools &lt;tool&gt; [flags]</code>
  </footer>
</div>

<script>
const toolSel = document.getElementById('tool');
const taglineEl = document.getElementById('tagline');
const flagsEl = document.getElementById('flags');
const noFlags = document.getElementById('noFlags');
const inputEl = document.getElementById('input');
const runBtn = document.getElementById('run');
const outCard = document.getElementById('outCard');
const outEl = document.getElementById('out');
const outInfo = document.getElementById('outInfo');
const copyBtn = document.getElementById('copy');
const healthEl = document.getElementById('health');

let TOOLS = [];

async function boot() {
  try {
    const [h, t] = await Promise.all([
      fetch('/api/health').then(r => r.json()),
      fetch('/api/tools').then(r => r.json()),
    ]);
    healthEl.textContent = `local Ollama · ${h.model} · ${t.tools.length} tools`;
    TOOLS = t.tools;
    toolSel.innerHTML = '';
    for (const tool of TOOLS) {
      const o = document.createElement('option');
      o.value = tool.name;
      o.textContent = tool.name;
      toolSel.appendChild(o);
    }
    renderTool();
  } catch (e) {
    healthEl.innerHTML = '<span class="err">⚠ server API unreachable — is serve.js running?</span>';
  }
}

function renderTool() {
  const tool = TOOLS.find(t => t.name === toolSel.value);
  if (!tool) return;
  taglineEl.textContent = tool.tagline || '';
  flagsEl.innerHTML = '';
  noFlags.style.display = tool.flags.length ? 'none' : 'inline';
  for (const f of tool.flags) {
    const div = document.createElement('div');
    div.className = 'flag';
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = '--' + f.flag;
    div.appendChild(name);
    if (f.kind === 'bool') {
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.dataset.flag = f.flag; cb.dataset.kind = 'bool';
      div.appendChild(cb);
    } else {
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.placeholder = 'value';
      inp.dataset.flag = f.flag; inp.dataset.kind = 'value';
      div.appendChild(inp);
    }
    flagsEl.appendChild(div);
  }
}

function buildFlags() {
  const flags = {};
  for (const el of flagsEl.querySelectorAll('input[data-flag]')) {
    if (el.dataset.kind === 'bool') {
      if (el.checked) flags[el.dataset.flag] = true;
    } else if (el.value.trim()) {
      flags[el.dataset.flag] = el.value.trim();
    }
  }
  return flags;
}

async function run() {
  const input = inputEl.value.trim();
  if (!input) { inputEl.focus(); return; }
  runBtn.disabled = true;
  runBtn.innerHTML = '<span class="spin">◌</span> running…';
  outCard.style.display = 'block';
  outEl.textContent = '';
  outEl.className = '';
  outInfo.textContent = `${toolSel.value} — asking the local model…`;
  try {
    const r = await fetch('/api/run', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tool: toolSel.value, input, flags: buildFlags() }),
    });
    const d = await r.json();
    if (d.ok) {
      outEl.textContent = d.output;
      outInfo.textContent = `${d.tool} · ${(d.tookMs / 1000).toFixed(1)}s · ${d.output.length} chars`;
    } else {
      outEl.textContent = '⚠ ' + (d.error || 'unknown error');
      outEl.className = 'err';
      outInfo.textContent = 'failed';
    }
  } catch (e) {
    outEl.textContent = '⚠ ' + e.message;
    outEl.className = 'err';
    outInfo.textContent = 'request failed';
  } finally {
    runBtn.disabled = false;
    runBtn.textContent = '▶ Run';
  }
}

copyBtn.addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(outEl.textContent);
    copyBtn.textContent = 'copied ✓';
    setTimeout(() => (copyBtn.textContent = 'copy'), 1500);
  } catch {}
});
toolSel.addEventListener('change', renderTool);
runBtn.addEventListener('click', run);
inputEl.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') run();
});
boot();
</script>
</body>
</html>
